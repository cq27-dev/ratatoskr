name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # swc_core + microsandbox + the crypto stack make debug artifacts huge; symbols aren't needed to
  # run tests, and dropping them keeps target/ under the runner's disk (a full disk shows up as a
  # linker SIGBUS or "No space left on device").
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reclaim ~25GB of preinstalled toolchains we don't use; the swc/microsandbox build tree is
      # large enough that the default free space isn't enough.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost

      # microsandbox pulls the `capng` crate, which links the system libcap-ng.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev

      # rust-toolchain.toml pins the channel + components (rustfmt, clippy).
      - name: Cache cargo & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # The microsandbox backend is off by default (its build script needs network); keep the
      # opt-in path compiling. Runs on CI, which has network to fetch the helper binary.
      - name: check microsandbox feature
        run: cargo clippy -p ratatoskr-exec --all-targets --features microsandbox -- -D warnings
