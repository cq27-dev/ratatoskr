[package]
name = "ratatoskr-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ratatoskr-store.workspace = true
# The per-node routes, so the pipeline can say what a node will run on before it runs.
ratatoskr-core.workspace = true
axum.workspace = true
tower-http.workspace = true
tokio = { workspace = true, features = ["net", "process", "fs", "io-util", "time"] }
tokio-stream.workspace = true
serde.workspace = true
# The GitHub webhook's signature.
hmac.workspace = true
sha2.workspace = true
uuid.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# `ServiceExt::oneshot`, to drive the real router in tests. Authorization that is only unit-tested
# proves the predicate, not that any route calls it.
tower = { workspace = true, features = ["util"] }
# Only so `every_run_status_is_classified` can enumerate the real variants: `is_terminal` matches
# on strings, so without this a new status silently reads as still-executing.
ratatoskr-core.workspace = true
strum = { workspace = true, features = ["derive"] }

[lints]
workspace = true
