[package]
name = "ratatoskr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ratatoskr"
path = "src/main.rs"

[dependencies]
ratatoskr-core.workspace = true
ratatoskr-mcp.workspace = true
ratatoskr-agent.workspace = true
ratatoskr-nodes.workspace = true
ratatoskr-exec.workspace = true
ratatoskr-script.workspace = true
ratatoskr-store.workspace = true
ratatoskr-serve.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
# Only to reject an endpoint the SDK would silently replace with its localhost default.
http.workspace = true
anyhow.workspace = true
dotenvy.workspace = true
uuid.workspace = true
serde_json.workspace = true
# Pinned now so the full dependency tree resolves in CI; used from Phase 3 (gix worktrees).
gix.workspace = true

[dev-dependencies]
# Only so the round-trip test can decode what actually went over the wire, rather than asserting
# that *something* was POSTed. Already in the tree via opentelemetry-otlp.
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"

[lints]
workspace = true
