[package]
name = "ratatoskr-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Optional: pulls in a build script that downloads `agentd` from GitHub, which fails in the
# no-network test sandbox. Off by default so the landlock backend builds offline; opt in with
# `--features microsandbox` when you actually want the MicroVM backend.
microsandbox = { workspace = true, optional = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
thiserror.workspace = true
tracing.workspace = true

[features]
# Compile the microsandbox (MicroVM) backend. Off by default — see the dependency note above.
microsandbox = ["dep:microsandbox"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "time"] }

[lints]
workspace = true
