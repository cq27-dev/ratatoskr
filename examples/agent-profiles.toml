# Deployment routes for agent profiles a workflow declares.
#
# An agent profile's *structure* — its base prompt, capability ceiling, and turn cap — lives in the
# workflow that uses it (`agents:` in `defineWorkflow`, see `examples/workflow.ts`). The TOML side
# carries only what is deployment's to decide: which model serves the profile. A structural key
# here (`capabilities`, `base_prompt`, `max_turns`) fails config load rather than silently
# overriding the workflow.
#
# A profile's `model` takes precedence over `[models.<stage>]`; omit the table entirely for a
# profile whose stages should keep their existing stage-keyed routes.

# `examples/workflow.ts` declares the `requirements` profile. Routing it here gives its stage its
# own model without changing how the built-in stages resolve theirs.
[agents.requirements.model]
provider = "anthropic"
model = "claude-sonnet-4-6"
