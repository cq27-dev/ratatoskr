[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/cq27-dev/ratatoskr"

[workspace.lints.rust]
warnings = "deny"

[workspace.dependencies]
# Internal crates
ratatoskr-core = { path = "crates/ratatoskr-core" }
ratatoskr-agent = { path = "crates/ratatoskr-agent" }
ratatoskr-graph = { path = "crates/ratatoskr-graph" }
ratatoskr-nodes = { path = "crates/ratatoskr-nodes" }
ratatoskr-exec = { path = "crates/ratatoskr-exec" }
ratatoskr-script = { path = "crates/ratatoskr-script" }
ratatoskr-mcp = { path = "crates/ratatoskr-mcp" }
ratatoskr-store = { path = "crates/ratatoskr-store" }

# External — pinned in Phase 0 so the dependency tree resolves and compiles cleanly
# before any logic depends on it (rmcp/gix/rig-core are wired but unused until later phases).
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync"] }
rig-core = "0.41"
# rig-agent carries the Agent runtime + the rmcp tool bridge (split out of rig-core in 0.41).
# It pins rmcp 2.x, so rmcp here must match — a 3.x Peer wouldn't type-check against `.rmcp_tools()`.
rig-agent = { version = "0.41", features = ["rmcp"] }
rmcp = { version = "2.2", features = ["client", "transport-child-process"] }
gix = "0.86"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
# Pinned to 0.32 so its libsqlite3-sys (^0.30.1) unifies with microsandbox's sqlx 0.8
# (also ^0.30.1) — one bundled SQLite, no duplicate `links = "sqlite3"` conflict. `bundled`
# forces that shared libsqlite3-sys to embed SQLite, so no system library is needed.
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"
toml = "1"
dotenvy = "0.15"
# jsonschema validates node output values against their schemars-generated schema. default-features
# off drops the reqwest-based remote-$ref resolver we don't need (schemas are local & self-contained).
jsonschema = { version = "0.49", default-features = false }
uuid = { version = "1", features = ["v4"] }
strum = { version = "0.28", features = ["derive"] }
# Phase 3 execution: MicroVM sandbox + ACP client for driving a coding CLI.
microsandbox = "0.6.8"
agent-client-protocol = "2.0.0"
