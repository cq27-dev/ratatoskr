[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/cq27-dev/ratatoskr"

[workspace.lints.rust]
warnings = "deny"

[workspace.dependencies]
# The run-bundle format: a run exported for someone else to analyse. BSON rather than JSON because
# a bundle is machine-to-machine, carries binary-ish payloads, and is read back in full.
bson = { version = "3", features = ["serde"] }

# Internal crates
ratatoskr-core = { path = "crates/ratatoskr-core" }
ratatoskr-agent = { path = "crates/ratatoskr-agent" }
ratatoskr-graph = { path = "crates/ratatoskr-graph" }
ratatoskr-nodes = { path = "crates/ratatoskr-nodes" }
ratatoskr-exec = { path = "crates/ratatoskr-exec" }
ratatoskr-script = { path = "crates/ratatoskr-script" }
ratatoskr-mcp = { path = "crates/ratatoskr-mcp" }
ratatoskr-store = { path = "crates/ratatoskr-store" }
ratatoskr-serve = { path = "crates/ratatoskr-serve" }
ratatoskr-plugin = { path = "crates/ratatoskr-plugin" }

# External — pinned in Phase 0 so the dependency tree resolves and compiles cleanly
# before any logic depends on it (rmcp/gix/rig-core are wired but unused until later phases).
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync"] }
rig-core = "0.41"
# rig-agent carries the Agent runtime + the rmcp tool bridge (split out of rig-core in 0.41).
# It pins rmcp 2.x, so rmcp here must match — a 3.x Peer wouldn't type-check against `.rmcp_tools()`.
rig-agent = { version = "0.41", features = ["rmcp"] }
# Conversation-memory policies + the CompactingMemory adapter. Version-locked to rig-core: the
# `Compactor` trait itself lives there, so a skew here is a trait mismatch rather than a warning.
rig-memory = "0.41"
rmcp = { version = "2.2", features = ["client", "transport-child-process"] }
gix = "0.86"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
# Pinned to 0.32 so its libsqlite3-sys (^0.30.1) unifies with microsandbox's sqlx 0.8
# (also ^0.30.1) — one bundled SQLite, no duplicate `links = "sqlite3"` conflict. `bundled`
# forces that shared libsqlite3-sys to embed SQLite, so no system library is needed.
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
futures = "0.3"
glob = "0.3"
regex = "1"
walkdir = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"
toml = "1"
dotenvy = "0.15"
# jsonschema validates node output values against their schemars-generated schema. default-features
# off drops the reqwest-based remote-$ref resolver we don't need (schemas are local & self-contained).
jsonschema = { version = "0.49", default-features = false }
uuid = { version = "1", features = ["v4"] }
strum = { version = "0.28", features = ["derive"] }
# The observability dashboard's HTTP layer. axum (Tower) rather than an actor framework: the rest
# of the workspace is plain async/await Tokio, and this composes with it directly.
axum = "0.8"
# ReceiverStream, to hand a channel of log events to axum's SSE response.
tokio-stream = "0.1"
# Already in the tree via rig; a direct dep so a run can reach the dashboard to ask a human.
# No TLS features: the only thing a run talks to here is a loopback dashboard over plain HTTP.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# Header types for the model endpoint. Already in the tree via rig, which takes an `http::HeaderMap`.
http = "1"
# `fs` only: ServeDir/ServeFile for the built dashboard assets.
tower-http = { version = "0.7", features = ["fs"] }
# Already in the tree under axum; a direct dev-dependency so serve's tests can drive its router.
tower = "0.5"
# Phase 3 execution: sandboxed repository commands and acceptance checks.
microsandbox = "0.6.8"
# Hosted-instance identity. Argon2id is the current default recommendation for passwords, and the
# PHC string it emits carries its own parameters — so raising the cost later applies on next login
# rather than needing a migration. `sha2` because a session token is stored as a digest, so a
# leaked auth database cannot be replayed against a live server.
argon2 = "0.5"
sha2 = "0.10"
# Verifying GitHub's `X-Hub-Signature-256`. `Mac::verify_slice` compares in constant time, which a
# hand-rolled equality does not — and a comparison that returns early leaks how much of a guess was
# right, one byte at a time.
hmac = "0.12"
# Pinned to 0.6 because that is the rand_core `password-hash` speaks, and `SaltString::generate`
# takes its RNG trait — a 0.9 RNG will not satisfy it. `getrandom` is what makes `OsRng` exist at
# all: argon2's own `rand` feature only enables the rand_core *dependency*, not its OS entropy
# source, and it exposes no way to turn this on from there.
rand_core = { version = "0.6", features = ["getrandom"] }
